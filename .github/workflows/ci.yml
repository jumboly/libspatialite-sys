name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allow manual runs to revalidate after upstream toolchain image bumps
  # without pushing a fresh commit.
  workflow_dispatch:

# Cancel any in-progress run for the same ref. Saves CI minutes when a
# branch gets a flurry of pushes (typical during build.rs iteration).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Surface deny-by-default warnings as build failures so silent lints don't
  # accumulate while the crate is in pre-0.1 churn.
  RUSTFLAGS: "-D warnings"

jobs:
  # Cheapest signal: make sure the default (no feature) build still parses
  # and links a binary that just declares FFI symbols. Catches Cargo.toml
  # / src/lib.rs syntax regressions without paying the bundled build cost.
  default-build:
    name: default build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --verbose
      - run: cargo test --verbose

  # Source-build smoke (Linux + macOS only). Compiles libspatialite + GEOS +
  # PROJ + zlib from source via cc::Build (and cmake for the geos-src /
  # proj-sys transitive crates). Windows MSVC is excluded here because
  # libspatialite 5.1.0 hits MSVC parser error C2054 around
  # `gg_shape.c::gaia_win_fopen`; the `bundled-vcpkg` job below covers
  # Windows.
  bundled-smoke:
    name: bundled smoke (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux
            os: ubuntu-latest
            install-cmd: sudo apt-get update && sudo apt-get install -y cmake pkg-config
          - label: macos
            os: macos-latest
            install-cmd: brew install cmake
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install build prerequisites
        run: ${{ matrix.install-cmd }}
        shell: bash
      - run: cargo build --features bundled --verbose
      - run: cargo test --features bundled --verbose

  # Windows MSVC bundled smoke via vcpkg. Compiles a single shpx.exe that
  # statically links libspatialite + GEOS + PROJ + sqlite3 + zlib all
  # supplied by vcpkg's `libspatialite:x64-windows-static-md` port. The
  # vcpkg port carries the upstream-compatibility patches that make
  # libspatialite 5.1.0 build under MSVC.
  bundled-vcpkg-smoke:
    name: bundled-vcpkg smoke (windows)
    runs-on: windows-latest
    env:
      # Match cargo-dist's `msvc-crt-static = false` (== /MD dynamic ucrt).
      # See build.rs for why we don't override the triplet from Rust code.
      VCPKGRS_TRIPLET: x64-windows-static-md
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # GitHub-hosted windows-latest comes with a stale vcpkg checkout
      # under C:\vcpkg. Run `git pull` so we get current ports + triplets.
      - name: Update bundled vcpkg checkout
        shell: pwsh
        run: |
          cd C:\vcpkg
          git pull --ff-only
          .\bootstrap-vcpkg.bat -disableMetrics

      # Restore the binary cache so subsequent runs do not rebuild
      # libspatialite + GEOS + PROJ from scratch each time. The cache
      # key includes the vcpkg HEAD commit so port version bumps surface
      # as cache misses (correct behavior).
      - name: Cache vcpkg binary archives
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: vcpkg-archives-${{ runner.os }}-${{ env.VCPKGRS_TRIPLET }}-${{ hashFiles('C:/vcpkg/.git/HEAD') }}-libspatialite
          restore-keys: |
            vcpkg-archives-${{ runner.os }}-${{ env.VCPKGRS_TRIPLET }}-

      - name: vcpkg install libspatialite
        shell: pwsh
        run: |
          C:\vcpkg\vcpkg.exe install --triplet=$env:VCPKGRS_TRIPLET libspatialite

      - name: cargo build (bundled-vcpkg)
        shell: pwsh
        env:
          VCPKG_ROOT: C:\vcpkg
        run: cargo build --features bundled-vcpkg --verbose

      - name: cargo test (bundled-vcpkg)
        shell: pwsh
        env:
          VCPKG_ROOT: C:\vcpkg
        run: cargo test --features bundled-vcpkg --verbose
