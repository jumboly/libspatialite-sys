[package]
name        = "libspatialite-sys"
version     = "0.0.1"
edition     = "2021"
rust-version = "1.75"
authors     = ["jumboly <jumboly@gmail.com>"]
license     = "MIT OR Apache-2.0"
description = "Low-level FFI bindings and bundled build of libspatialite (SpatiaLite SQLite extension)"
repository  = "https://github.com/jumboly/libspatialite-sys"
readme      = "README.md"
keywords    = ["spatialite", "sqlite", "geospatial", "gis", "ffi"]
categories  = ["external-ffi-bindings", "science::geo"]
# Declare the `links` key so Cargo's duplicate-link-name detection prevents
# multiple libspatialite copies from being statically linked into a single binary.
links       = "spatialite"
exclude     = ["/.github/", "/scripts/"]

[features]
# Default: headers + FFI declarations only. Library resolution is left to the
# consumer (e.g. `rusqlite::Connection::load_extension("mod_spatialite")` for
# dynamic loading, or pkg-config / explicit link search for static system libs).
default        = []

# Build libspatialite from vendored source via `cc::Build`, statically linked
# alongside GEOS / PROJ / zlib. Tested in CI on Linux and macOS. Windows MSVC
# has known upstream-source incompatibilities (notably a `GAIAGEO_DECLARE`
# macro expansion that hits MSVC parser error C2054 in `gg_shape.c`); use
# `bundled-vcpkg` instead for Windows.
bundled        = [
    "dep:cc",
    "dep:geos-src",
    "dep:link-cplusplus",
    "dep:libz-sys",
    "dep:proj-sys",
]

# Resolve libspatialite via vcpkg (`vcpkg install libspatialite:x64-windows-static-md`)
# for Windows MSVC. The vcpkg port carries upstream-compatibility patches that
# avoid the MSVC parser issues hit by the in-tree `bundled` path. Implementation
# lands in a follow-up commit.
bundled-vcpkg  = []

[dependencies]
# Forwards the SQLite header path (`sqlite3.h` / `sqlite3ext.h`) to our build.rs
# via Cargo's `links = "sqlite3"` => `DEP_SQLITE3_INCLUDE` propagation. Even
# though we never call into `libsqlite3-sys` from Rust, declaring it as a direct
# dependency is the canonical way to receive `DEP_SQLITE3_INCLUDE` in our build
# script.
libsqlite3-sys = { version = "0.28", features = ["bundled"] }

# Ensure the C++ standard library is linked when the `bundled` feature is on.
# libspatialite itself is pure C, but it links to libgeos which is C++.
link-cplusplus = { version = "1.0", optional = true }

# libspatialite's `gg_relations.c::evalGeosCache` requires zlib's `crc32`. The
# `static` feature builds zlib from vendored source, so the bundled spatialite
# stack does not depend on a system zlib (matters most on Windows MSVC where
# system zlib is absent).
libz-sys = { version = "1", default-features = false, features = ["static"], optional = true }

# Pulled in only for the `bundled` feature so that `proj-sys`'s build script
# runs first and produces an OUT_DIR with `libproj.a` + `proj.h`. We re-discover
# that OUT_DIR from `build.rs` because proj-sys 0.25 does not emit `cargo:include=`.
# Linking is left to proj-sys (its `links = "proj"` declaration emits the
# canonical `cargo:rustc-link-lib=proj`).
proj-sys = { version = "0.25", default-features = false, features = ["bundled_proj"], optional = true }

[build-dependencies]
# Compile vendored libspatialite C source. `cc` is gated by the `bundled` feature.
cc = { version = "1", optional = true }

# Build libgeos (C/C++) for static linking with the bundled libspatialite.
# We discover its OUT_DIR (`<build_root>/geos-src-*/out/{include,lib}`) at
# build time because geos-src 0.2 does not emit `cargo:include=`.
geos-src = { version = "0.2", optional = true }
